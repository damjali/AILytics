name: ailytics
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase dependencies (Updated to latest versions)
  firebase_core: ^2.24.2
  firebase_auth: ^4.17.6
  cloud_firestore: ^4.15.6

  # State management
  provider: ^6.0.5

  # UI packages
  flutter_svg: ^2.0.7
  google_fonts: ^6.2.1

  # Validation
  email_validator: ^3.0.0

  # Default Flutter icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Ensure the assets folder exists in your project
  assets:
    - assets/images/
